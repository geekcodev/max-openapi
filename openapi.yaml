    Callback:
      type: object
      description: |
        Данные нажатой callback-кнопки, по которым бот получает событие `message_callback`.

        Обязательны `timestamp`, `callback_id` и `user` — официальная `schema.yaml`, схема
        `Callback` (проверено 2026-09-27). Исходное сообщение с клавиатурой вложением **не**
        является: в официальной модели оно лежит рядом, в `MessageCallbackUpdate.message`
        (может быть `null`, если сообщение удалили к моменту получения события).
      properties:
        timestamp:
          type: integer
          format: int64
          description: Момент нажатия кнопки (Unix timestamp в мс)
        callback_id:
          type: string
          description: Идентификатор callback-кнопки
        payload:
          type: string
          description: Payload кнопки
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          description: Пользователь, нажавший кнопку
      required:
        - timestamp
        - callback_id
        - user

    SuccessResponse:
      type: object
      description: Стандартный ответ об успехе/ошибке
      properties:
        success:
          type: boolean
          description: '`true`, если операция выполнена успешно'
        message:
          type: [string, "null"]
          description: Описание ошибки (при неуспехе)
      required:
        - success

    FailedUserDetails:
      type: object
      description: Подробная причина, по которой пользователя не удалось добавить в чат
      properties:
        error_code:
          type: string
          description: |
            Код ошибки:
            - `add.participant.privacy` — приватность не позволяет добавить участника
            - `add.participant.not.found` — пользователь не найден
        user_ids:
          type: array
          description: ID пользователей, которых не удалось добавить
          items:
            type: integer
            format: int64
      required:
        - error_code
        - user_ids

    ErrorResponse:
      type: object
      description: Ответ об ошибке
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Описание ошибки
        error:
          type: [string, "null"]
          description: Дополнительная информация об ошибке
      required:
        - code
        - message

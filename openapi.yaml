openapi: 3.1.0
info:
  title: MAX Messenger Bot API
  description: |
    API MAX — это интерфейс, который позволяет ботам взаимодействовать с платформой MAX
    и получать необходимые данные с помощью HTTPS-запросов к серверу.

    **Base URL:** `https://platform-api2.max.ru`

    **Аутентификация:** Заголовок `Authorization: <access_token>`.
    Передача токена через query-параметры больше не поддерживается.

    **Важно:**
    - Используйте домен `platform-api2.max.ru` вместо `platform-api.max.ru`.
    - Добавьте сертификат Минцифры в список доверенных.
    - HTTP вебхуки больше не поддерживаются — используйте HTTPS.
    - Long Polling ограничен по скорости и сроку хранения событий — не подходит для production.
    - Лимит запросов: 30 rps на `platform-api2.max.ru`.
  version: 1.0.0
  # Сверено с официальной машинной схемой MAX (max-messenger/api-schema).
  # `version` — жёсткая привязка (сверяется tools/check_spec.py), `commit`/`verified` — справочно.
  # См. AGENTS.md § 7.1.
  x-official-schema:
    version: "0.0.33"
    commit: "1a4a502"
    source: https://github.com/max-messenger/api-schema
    verified: "2026-10-20"
  contact:
    name: MAX Developer Support
    url: https://dev.max.ru/help
  license:
    name: Proprietary
    url: https://dev.max.ru

servers:
  - url: https://platform-api2.max.ru
    description: Основной сервер API

security:
  - bearerAuth: [ ]

tags:
  - name: Bots
    description: Управление информацией о боте
  - name: Chats
    description: Управление групповыми чатами и каналами
  - name: Subscriptions
    description: Управление подписками на обновления (Webhook / Long Polling)
  - name: Uploads
    description: Загрузка медиафайлов
  - name: Messages
    description: Отправка, получение, редактирование и удаление сообщений
  - name: Answers
    description: Ответ на callback-кнопки
  - name: Comments
    description: Комментарии к постам в каналах (добавлены в августе 2026)

paths:
  /me:
    get:
      operationId: getMe
      summary: Получение информации о боте
      description: 'Возвращает объект `BotInfo` с id бота, именем, username, временем последней активности, описанием, аватаром и командами.'
      tags: [ Bots ]
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /me/commands:
    patch:
      operationId: editBotCommands
      summary: Редактирование команд бота
      description: |
        Добавляет, редактирует или удаляет команды бота.
        Чтобы удалить все команды, передайте пустой массив `[]`.
      tags: [ Bots ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commands:
                  type: [array, "null"]
                  description: Массив команд бота (максимум 32)
                  items:
                    $ref: "#/components/schemas/BotCommand"
      responses:
        "200":
          description: Команды успешно обновлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: [array, "null"]
                    items:
                      $ref: "#/components/schemas/BotCommand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}:
    get:
      operationId: getChat
      summary: Получение информации о групповом чате или канале
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    patch:
      operationId: editChat
      summary: Изменение информации о групповом чате или канале
      description: Бот должен быть администратором чата/канала.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: [string, "null"]
                  description: Название чата (1–200 символов)
                  minLength: 1
                  maxLength: 200
                description:
                  type: [string, "null"]
                  description: |
                    Описание чата или канала, до 16000 символов. Пустая строка снимает описание.
                    Поле добавлено в августе 2026 (`https://dev.max.ru/docs-api/changelog-api`, раздел Chats)
                  maxLength: 16000
                icon:
                  type: [object, "null"]
                  description: Изображение иконки чата
                  properties:
                    url:
                      type: string
                      description: URL изображения
                    payload:
                      type: string
                      description: Payload изображения
                pin:
                  type: [string, "null"]
                  description: ID сообщения для закрепления (для открепления используйте DELETE pin)
                notify:
                  type: [boolean, "null"]
                  default: true
                  description: Отправлять ли системное уведомление об изменении
      responses:
        "200":
          description: Информация о чате обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}/actions:
    post:
      operationId: sendBotAction
      summary: Отправка действия бота в групповой чат
      description: |
        Отправляет действие бота (печатает, отправляет фото/видео/аудио/файл).
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  $ref: "#/components/schemas/SenderAction"
      responses:
        "200":
          description: Действие отправлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}/pin:
    get:
      operationId: getPinnedMessage
      summary: Получение закреплённого сообщения в групповом чате или канале
      description: Бот должен быть администратором.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    anyOf:
                      - $ref: "#/components/schemas/Message"
                      - type: "null"
                    description: Закреплённое сообщение (null, если нет)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: pinMessage
      summary: Закрепление сообщения в групповом чате или канале
      description: Бот должен быть администратором.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message_id
              properties:
                message_id:
                  type: string
                  description: 'ID сообщения для закрепления (совпадает с `Message.body.mid`)'
                notify:
                  type: [boolean, "null"]
                  default: true
                  description: Уведомлять участников о закреплении
      responses:
        "200":
          description: Сообщение закреплено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: unpinMessage
      summary: Открепление сообщения в групповом чате или канале
      description: Бот должен быть администратором.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Сообщение откреплено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}/members/me:
    get:
      operationId: getBotMembership
      summary: Получение информации о членстве бота в групповом чате или канале
      description: |
        Возвращает информацию о членстве бота в чате/канале, включая доступные права администратора.
        Бот идентифицируется по access_token.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: removeBotFromChat
      summary: Удаление бота из группового чата или канала
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Бот удалён из чата
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}/members/admins:
    get:
      operationId: getChatAdmins
      summary: Получение списка администраторов группового чата или канала
      description: Возвращает список всех администраторов (пользователей и ботов) с данными. Бот должен быть администратором.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMember"
                  marker:
                    type: [integer, "null"]
                    format: int64
                    description: Маркер для следующей страницы
                required:
                  - members
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: addChatAdmin
      summary: Назначить администратора группового чата или канала
      description: |
        Назначает права администратора пользователям/ботам, которые являются участниками чата/канала.
        Бот должен быть администратором с правом `add_admins`.
        Повторный вызов с тем же пользователем заменяет его права (PUT-семантика).
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admins
              properties:
                admins:
                  type: array
                  description: Список пользователей/ботов для назначения администраторами
                  items:
                    $ref: "#/components/schemas/ChatAdmin"
                marker:
                  type: [integer, "null"]
                  format: int64
                  description: Указатель на следующую страницу данных (для большого количества администраторов)
      responses:
        "200":
          description: Администраторы назначены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}/members/admins/{userId}:
    delete:
      operationId: removeChatAdmin
      summary: Отменить права администратора в групповом чате или канале
      description: |
        Отзывает права администратора у пользователя/бота. Они остаются в чате.
        Бот должен быть администратором с правом `add_admins`.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: userId
          in: path
          required: true
          description: ID пользователя/бота для снятия с администратора
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Права администратора отменены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chats/{chatId}/members:
    get:
      operationId: getChatMembers
      summary: Получение участников группового чата или канала
      description: Бот должен быть администратором.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: user_ids
          in: query
          required: false
          description: |
            Конкретные ID пользователей для проверки (игнорирует `count` и `marker`).
          schema:
            type: [array, "null"]
            items:
              type: integer
              format: int64
        - name: marker
          in: query
          required: false
          description: Маркер для следующей страницы
          schema:
            type: integer
            format: int64
        - name: count
          in: query
          required: false
          description: Количество участников для возврата (по умолчанию 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMember"
                  marker:
                    type: [integer, "null"]
                    format: int64
                    description: Маркер для следующей страницы
                required:
                  - members
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: addChatMembers
      summary: Добавление участников в групповой чат
      description: |
        Добавляет участников в групповой чат. Бот должен быть администратором с правом `add_remove_members`.
        Нельзя добавлять подписчиков в каналы.

        > **С 9 сентября 2026 работа метода ограничена** — `https://dev.max.ru/docs-api/changelog-api`
        > (раздел «Критически важные изменения», проверено 2026-10-19). Пометки об удалении в актуальной доке нет;
        > операция и схема `FailedUserDetails` присутствуют и в официальной `schema.yaml`.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
              properties:
                user_ids:
                  type: array
                  description: Массив ID пользователей (максимум 100)
                  items:
                    type: integer
                    format: int64
                  maxItems: 100
      responses:
        "200":
          description: Результат изменения состава участников чата
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      failed_user_ids:
                        type: [array, "null"]
                        description: ID пользователей, которых не удалось добавить
                        items:
                          type: integer
                          format: int64
                      failed_user_details:
                        type: [array, "null"]
                        description: Подробные причины ошибок
                        items:
                          $ref: "#/components/schemas/FailedUserDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: removeChatMember
      summary: Удаление участников из группового чата или канала
      description: |
        Удаляет участника из чата/канала. Бот должен быть администратором с правом `add_remove_members`.
      tags: [ Chats ]
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: user_id
          in: query
          required: true
          description: ID пользователя для удаления
          schema:
            type: integer
            format: int64
        - name: block
          in: query
          required: false
          description: |
            Если `true`, пользователь блокируется (только для чатов по публичной/приватной ссылке, игнорируется для остальных)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Участник удалён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /subscriptions:
    get:
      operationId: getSubscriptions
      summary: Получение всех подписок через Webhook
      tags: [ Subscriptions ]
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
                required:
                  - subscriptions
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: createSubscription
      summary: Подписка на обновления о новых событиях через Webhook
      description: |
        Создаёт подписку на обновления через Webhook — основной механизм доставки событий для production.

        **Модель доставки событий:**
        1. Событие происходит → POST на webhook-эндпоинт с объектом `Update`
        2. TLS-валидация эндпоинта
        3. Если указан `secret`, проверяется заголовок `X-Max-Bot-Api-Secret`
        4. Эндпоинт должен вернуть HTTP 200 в течение 30 секунд
        5. Экспоненциальные повторы: 60с → 150с → 375с → ... (10 попыток за ~8 часов)
        6. Если нет успеха в течение 8 часов, бот автоматически отписывается

        **Требования к webhook-эндпоинту:**
        - HTTPS на порту 443
        - TLS-сертификат от доверенного CA или сертификат Минцифры (без самоподписных)
        - Домен должен совпадать с CN или SAN
        - Полная цепочка сертификатов обязательна

        Long Polling отключается при активной подписке.
      tags: [ Subscriptions ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: 'HTTPS URL эндпоинта (должен начинаться с `https://`)'
                  pattern: "^https://"
                update_types:
                  type: [array, "null"]
                  description: |
                    Типы обновлений для подписки (например, `["message_created", "bot_started"]`).
                    См. объект Update для полного списка.
                  items:
                    type: string
                secret:
                  type: [string, "null"]
                  description: |
                    Секретный ключ (5–256 символов, `[a-zA-Z0-9_-]`).
                    Передаётся в заголовке `X-Max-Bot-Api-Secret`.
                  minLength: 5
                  maxLength: 256
                  pattern: "^[a-zA-Z0-9_-]+$"
      responses:
        "200":
          description: Подписка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteSubscription
      summary: Отписка от обновлений о новых событиях через Webhook
      description: |
        После вызова бот перестаёт получать уведомления по webhook;
        Long Polling становится доступен.
      tags: [ Subscriptions ]
      parameters:
        - name: url
          in: query
          required: true
          description: URL webhook для удаления
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Подписка удалена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /updates:
    get:
      operationId: getUpdates
      summary: Получение обновлений о событиях через Long Polling
      description: |
        Long Polling — для разработки и тестирования. Не подходит для production.
        Получение обновлений ограничено по скорости и сроку хранения событий.
      tags: [ Subscriptions ]
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество обновлений за раз (по умолчанию 100)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: timeout
          in: query
          required: false
          description: Таймаут long-polling в секундах (по умолчанию 30)
          schema:
            type: integer
            minimum: 0
            maximum: 90
            default: 30
        - name: marker
          in: query
          required: false
          description: |
            Маркер для пагинации. Передайте `null` или опустите для получения только последних событий.
            Передайте маркер из предыдущего ответа для получения всех событий с момента последнего чтения.
          schema:
            type: [integer, "null"]
            format: int64
        - name: types
          in: query
          required: false
          description: |
            Типы обновлений (например, `types=message_created,message_callback`).
            См. объект Update для полного списка.
          schema:
            type: [array, "null"]
            items:
              type: string
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Update"
                  marker:
                    type: [integer, "null"]
                    format: int64
                    description: Маркер для следующего запроса
                required:
                  - updates
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads:
    post:
      operationId: uploadMedia
      summary: Загрузка медиафайлов
      description: |
        Загружает медиафайл и возвращает URL для загрузки и токен для прикрепления к сообщениям.

        **Поддерживаемые типы и ограничения:**

        | Тип | Форматы | Макс. размер |
        |-----|---------|-------------|
        | `image` | JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC | 50 МБ или 7680×7680 px |
        | `video` | MP4, MOV, MKV, WEBM | 250 МБ |
        | `audio` | MP3, WAV, M4A и др. | 256 МБ или 60 мин |
        | `file` | TXT, DOC, PDF и др. | 4 ГБ |

        `type=photo` deprecated — используйте `type=image`.

        **Домены для загрузки:**
        - `file` → `https://fu.oneme.ru`
        - `image` → `https://iu.oneme.ru`
        - `video`/`audio` → `https://vu.okcdn.ru`

        После загрузки подождите перед отправкой сообщения, чтобы избежать ошибки `attachment.not.ready`.
        Используйте экспоненциальную задержку при повторе.
      tags: [ Uploads ]
      parameters:
        - name: type
          in: query
          required: true
          description: Тип загружаемого файла
          schema:
            $ref: "#/components/schemas/UploadType"
      responses:
        "200":
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /messages:
    get:
      operationId: getMessages
      summary: Получение сообщений
      description: Получает сообщения из чата или по ID сообщений.
      tags: [ Messages ]
      parameters:
        - name: chat_id
          in: query
          required: false
          description: |
            ID чата для получения сообщений (обязателен, если `message_ids` не указан).
            Возвращает сообщения в обратном порядке (новые первыми).
          schema:
            type: integer
            format: int64
        - name: message_ids
          in: query
          required: false
          description: |
            Список ID сообщений через запятую (обязателен, если `chat_id` не указан).
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Unix timestamp в миллисекундах — сообщения с этого времени
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          required: false
          description: Unix timestamp в миллисекундах — сообщения до этого времени
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          description: |
            Сообщения после указанного timestamp (Unix, миллисекунды).
            Предпочтительнее `from` — сервер отдаёт страницу последних сообщений.
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: |
            Сообщения перед указанным timestamp (Unix, миллисекунды).
            Предпочтительнее `to` — страница более ранних сообщений.
          schema:
            type: integer
            format: int64
        - name: count
          in: query
          required: false
          description: Количество сообщений (по умолчанию 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                required:
                  - messages
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: sendMessage
      summary: Отправить сообщение
      description: |
        Отправляет сообщение в диалог, групповой чат или канал.

        **Ограничение скорости:** макс. 2 сообщения в секунду на диалог/чат/канал.

        **Параметры `user_id` / `chat_id` условные:** одно из них обязательно.

        **Правила комбинирования вложений:**
        - Видео и изображения можно комбинировать друг с другом и одной кнопкой — максимум 12 вложений
        - Файл можно отправить только в комбинации с вложением с кнопками — максимум 1 файл + 1 вложение с кнопками

        **Inline-клавиатура:** максимум 210 кнопок в 30 рядах, до 7 в ряде (кроме link/open_app/request_geo_location/request_contact — макс. 3).
      tags: [ Messages ]
      parameters:
        - name: user_id
          in: query
          required: false
          description: ID пользователя для сообщений в диалоге
          schema:
            type: integer
            format: int64
        - name: chat_id
          in: query
          required: false
          description: ID чата для сообщений в групповом чате/канале
          schema:
            type: integer
            format: int64
        - name: disable_link_preview
          in: query
          required: false
          description: |
            Управление превью ссылок в тексте.

            `true` — сервер не будет генерировать медиапревью для ссылок в тексте.

            **Баг официальной доки:** в `schema.yaml` написано обратное — «If `false`, server will not generate
            media preview for links in text» (проверено 2026-09-27), что противоречит `default: false` и смыслу имени
            параметра.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMessageBody"
      responses:
        "200":
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
                required:
                  - message
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: editMessage
      summary: Редактировать сообщение
      description: |
        Редактирует сообщение, отправленное ботом.

        **Ограничение скорости:** макс. 2 редактирования в секунду на диалог/чат/канал.

        **Ограничения на редактирование:**
        - Диалоги: сообщения с inline_keyboard можно редактировать в любое время; остальные — только в течение 7 дней
        - Групповые чаты и каналы: любые сообщения можно редактировать в любое время
      tags: [ Messages ]
      parameters:
        - name: message_id
          in: query
          required: true
          description: ID сообщения для редактирования
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMessageBody"
      responses:
        "200":
          description: Сообщение отредактировано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteMessage
      summary: Удалить сообщение
      description: |
        Удаляет сообщение из диалога, группового чата или канала.

        **Ограничения:**
        - Бот должен быть администратором с правом `delete`
        - Диалоги: можно удалять только сообщения, отправленные самим ботом
        - Групповые чаты: можно удалять любые сообщения
        - Каналы: можно удалять любые сообщения

        **Ограничение скорости:** макс. 2 удаления в секунду на диалог/чат/канал.
      tags: [ Messages ]
      parameters:
        - name: message_id
          in: query
          required: true
          description: ID сообщения для удаления
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Сообщение удалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /messages/{messageId}:
    get:
      operationId: getMessageById
      summary: Получить сообщение
      description: Получает одно сообщение по его ID.
      tags: [ Messages ]
      parameters:
        - name: messageId
          in: path
          required: true
          description: 'ID сообщения (`mid`)'
          schema:
            type: string
            pattern: "[a-zA-Z0-9_-]+"
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /videos/{videoToken}:
    get:
      operationId: getVideoInfo
      summary: Получить информацию о видео
      description: Возвращает URL для воспроизведения и метаданные видео.
      tags: [ Messages ]
      parameters:
        - name: videoToken
          in: path
          required: true
          description: Токен видео-вложения
          schema:
            type: string
            pattern: "[a-zA-Z0-9_-]+"
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /answers:
    post:
      operationId: sendAnswer
      summary: Ответ на callback
      description: |
        Отвечает на нажатие callback-кнопки. Может обновить текущее сообщение и/или отправить одноразовое уведомление.

        **Ограничение скорости:** макс. 2 ответа в секунду на диалог/чат/канал.
      tags: [ Answers ]
      parameters:
        - name: callback_id
          in: query
          required: true
          description: |
            ID callback-кнопки из объекта `Update` с типом `message_callback`
            (поле `updates[i].callback.callback_id`).
          schema:
            type: string
            pattern: "^(?!\\s*$).+"
        - name: disable_link_preview
          in: query
          required: false
          description: |
            Управление превью ссылок в тексте.

            `true` — сервер не будет генерировать медиапревью для ссылок в обновлённом тексте сообщения.
            Добавлено в августе 2026 (`https://dev.max.ru/docs-api/changelog-api`, раздел Messages).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  anyOf:
                    - $ref: "#/components/schemas/NewMessageBody"
                    - type: "null"
                  description: Заполните для обновления текущего сообщения
                notification:
                  type: [string, "null"]
                  description: Заполните, чтобы отправить пользователю одноразовое уведомление
      responses:
        "200":
          description: Ответ отправлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /messages/{messageId}/comments:
    get:
      operationId: getComments
      summary: Получение комментариев к посту
      description: |
        Возвращает комментарии к посту в канале. Комментарии доступны только для постов в каналах.
      tags: [ Comments ]
      parameters:
        - $ref: "#/components/parameters/messageId"
        - name: comment_ids
          in: query
          required: false
          description: Список ID комментариев через запятую
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Комментарии после указанного timestamp (Unix, миллисекунды)
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: Комментарии перед указанным timestamp (Unix, миллисекунды)
          schema:
            type: integer
            format: int64
        - name: count
          in: query
          required: false
          description: Максимальное количество комментариев в ответе (по умолчанию 50)
          schema:
            type: integer
            format: int32
            default: 50
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentMessageList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: sendComment
      summary: Отправка комментария
      description: |
        Отправляет комментарий к посту в канале. Вложения **не поддерживаются** — используйте `NewCommentBody`.
      tags: [ Comments ]
      parameters:
        - $ref: "#/components/parameters/messageId"
        - name: disable_link_preview
          in: query
          required: false
          description: |
            Управление превью ссылок в тексте комментария.

            `true` — сервер не будет генерировать медиапревью для ссылок в тексте.

            **Баг официальной доки:** в `schema.yaml` для этого параметра написано обратное — «If `false`, server will
            not generate media preview for links in text» (проверено 2026-09-27), что противоречит и `default: false`,
            и смыслу имени параметра. Спека придерживается `true` = превью выключено, как в `POST /messages`
            и `POST /answers`.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCommentBody"
      responses:
        "200":
          description: Комментарий отправлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: editComment
      summary: Редактирование комментария
      description: Редактирует ранее отправленный комментарий. Вложения не поддерживаются.
      tags: [ Comments ]
      parameters:
        - $ref: "#/components/parameters/messageId"
        - name: comment_id
          in: query
          required: true
          description: Идентификатор редактируемого комментария
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCommentBody"
      responses:
        "200":
          description: Комментарий отредактирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteComment
      summary: Удаление комментария
      description: Удаляет ранее отправленный комментарий.
      tags: [ Comments ]
      parameters:
        - $ref: "#/components/parameters/messageId"
        - name: comment_id
          in: query
          required: true
          description: Идентификатор удаляемого комментария
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Комментарий удалён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /messages/{messageId}/comments/{commentId}:
    get:
      operationId: getComment
      summary: Получение комментария по его ID
      description: Возвращает один комментарий поста в канале по его идентификатору.
      tags: [ Comments ]
      parameters:
        - $ref: "#/components/parameters/messageId"
        - name: commentId
          in: path
          required: true
          description: Идентификатор комментария (`mid`)
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Токен доступа бота. Передаётся в заголовке `Authorization: <token>`.
        Передача токена через query-параметры больше не поддерживается.

  parameters:
    chatId:
      name: chatId
      in: path
      required: true
      description: ID группового чата или канала
      schema:
        type: integer
        format: int64
        pattern: "-?\\d+"
    messageId:
      name: messageId
      in: path
      required: true
      description: Идентификатор сообщения (`mid`)
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Недействительный запрос (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Ошибка аутентификации (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Превышено количество запросов (429)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Сервис недоступен (503)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: Метод не разрешён (405) — например, отправка сообщений в неличный диалог без включённого `bot_can_write_to_pm`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ─── Enums ────────────────────────────────────────────────
    ChatType:
      type: string
      enum:
        - chat
        - channel
        - dialog
      description: Тип чата

    ChatStatus:
      type: string
      enum:
        - active
        - removed
        - left
        - closed
        - suspended
      description: Статус чата

    SenderAction:
      type: string
      enum:
        - typing_on
        - sending_photo
        - sending_video
        - sending_audio
        - sending_file
      description: Тип действия бота

    UploadType:
      type: string
      enum:
        - image
        - video
        - audio
        - file
      description: Тип загружаемого файла

    TextFormat:
      type: string
      enum:
        - markdown
        - html
      description: |
        Формат текста сообщения.

        **Markdown:**
        | Отображение | Синтаксис |
        |---|---|
        | курсив | `*emphasized*` или `_emphasized_` |
        | жирный | `**strong**` или `__strong__` |
        | зачёркнутый | `~~strikethrough~~` |
        | подчёркнутый | `++underline++` |
        | моноширинный | `` `code` `` |
        | ссылка | `[text](url)` |
        | @упоминание | `[Имя Фамилия](max://user/user_id)` |
        | выделенный | `^^выделенный^^` |
        | заголовок | `# заголовок` |
        | цитата | `> цитата` |

        **HTML:**
        | Отображение | Тег |
        |---|---|
        | курсив | `<i>` или `<em>` |
        | жирный | `<b>` или `<strong>` |
        | зачёркнутый | `<del>` или `<s>` |
        | подчёркнутый | `<ins>` или `<u>` |
        | моноширинный | `<pre>` или `<code>` |
        | ссылка | `<a href="url">text</a>` |
        | @упоминание | `<a href="max://user/user_id">Имя Фамилия</a>` |
        | выделенный | `<mark>text</mark>` |
        | заголовок | `<h1>`..`<h4>` (все уровни одинаковые) |
        | цитата | `<blockquote>text</blockquote>` |

    # ─── Разметка текста (ответ API) ───────────────────────────
    MarkupElement:
      type: object
      description: |
        Базовый тип элемента разметки текста.

        API возвращает текст сообщения в поле `MessageBody.markup` уже разобранным: `text` содержит
        «чистый» текст, а `markup` — список элементов с их позициями в тексте. Набор типов и их
        `type`-значения подтверждены официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `MarkupElement`
        (проверено 2026-09-27). Соответствие синтаксису `markdown`/`html` — см. `TextFormat`
        и `https://dev.max.ru/docs-api/use-cases/sending-messages/text-formatting`.
      properties:
        type:
          type: string
          description: |
            Тип элемента разметки. Соответствие синтаксису:

            - `strong` — `**жирный**` / `<b>`
            - `emphasized` — `*курсив*` / `<i>`
            - `underline` — `++подчёркнутый++` / `<u>`
            - `strikethrough` — `~~зачёркнутый~~` / `<s>`
            - `monospaced` — `` `моноширинный` `` / `<code>`
            - `highlighted` — `^^выделенный^^` / `<mark>`
            - `link` — `[текст](url)` / `<a href="url">`
            - `quote` — `> цитата` / `<blockquote>`
            - `heading` — `# заголовок` / `<h1>`..`<h4>`
            - `user_mention` — `[Имя](max://user/user_id)` / `<a href="max://user/user_id">`
          enum:
            - strong
            - emphasized
            - underline
            - strikethrough
            - monospaced
            - highlighted
            - link
            - quote
            - heading
            - user_mention
        from:
          type: integer
          format: int32
          description: Индекс начала элемента в тексте (с нуля)
        length:
          type: integer
          format: int32
          description: Длина элемента разметки в символах
      discriminator:
        propertyName: type
        mapping:
          strong: "#/components/schemas/StrongMarkup"
          emphasized: "#/components/schemas/EmphasizedMarkup"
          underlined: "#/components/schemas/UnderlineMarkup"
          strikethrough: "#/components/schemas/StrikethroughMarkup"
          monospaced: "#/components/schemas/MonospacedMarkup"
          highlighted: "#/components/schemas/HighlightedMarkup"
          quote: "#/components/schemas/QuoteMarkup"
          heading: "#/components/schemas/HeadingMarkup"
          link: "#/components/schemas/LinkMarkup"
          user_mention: "#/components/schemas/UserMentionMarkup"
      required:
        - type
        - from
        - length

    StrongMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Жирный текст (`**text**` / `<b>text</b>`)

    EmphasizedMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Курсив (`*text*` / `<i>text</i>`)

    UnderlineMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Подчёркнутый текст (`++text++` / `<u>text</u>`)

    StrikethroughMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Зачёркнутый текст (`~~text~~` / `<s>text</s>`)

    MonospacedMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: "Моноширинный текст (`` `text` `` / `<code>text</code>`)"

    HighlightedMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Выделенный текст (`^^text^^` / `<mark>text</mark>`)

    QuoteMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Цитата (`> text` / `<blockquote>text</blockquote>`)

    HeadingMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
      description: Заголовок (`# text` / `<h1>`..`<h4>`)

    LinkMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
        - type: object
          properties:
            url:
              type: string
              minLength: 1
              maxLength: 2048
              description: URL ссылки
          required:
            - url
      description: Ссылка в тексте (`[text](url)` / `<a href="url">text</a>`)

    UserMentionMarkup:
      allOf:
        - $ref: "#/components/schemas/MarkupElement"
        - type: object
          properties:
            user_id:
              type: [integer, "null"]
              format: int64
              description: Идентификатор упомянутого пользователя (если у него нет `username`)
            user_link:
              type: [string, "null"]
              description: "`@username` упомянутого пользователя"
      description: |
        Упоминание пользователя в тексте (`[Имя](max://user/user_id)` /
        `<a href="max://user/user_id">Имя</a>`). Упоминание возможно как по `username`, так и по ID,
        если у пользователя нет `username`.

    ChatAdminPermission:
      type: string
      enum:
        - read_all_messages
        - add_remove_members
        - add_admins
        - change_chat_info
        - pin_message
        - write
        - can_call
        - edit_link
        - edit
        - delete
        - view_stats
        - post_edit_delete_message
        - edit_message
        - delete_message
      description: |
        Права администратора чата/канала.

        Описание:
        - `read_all_messages` — чтение всех сообщений в канале или групповом чате
        - `edit` — редактирование постов в каналах (недоступно для групповых чатов)
        - `delete` — удаление постов (недоступно для групповых чатов)
        - `write` — редактирование/удаление сообщений в группах, написание постов в каналах
        - `pin_message` — закрепление сообщений
        - `change_chat_info` — изменение информации о канале или групповом чате
        - `add_remove_members` — добавление/удаление участников (для ботов: только чаты; для пользователей: только каналы)
        - `add_admins` — добавление/удаление администраторов
        - `edit_link` — редактирование ссылки группового чата (недоступно для каналов)
        - `can_call` — звонки в групповом чате (недоступно для каналов)
        - `view_stats` — просмотр статистики канала (только владелец, недоступно для групповых чатов)

        **Устаревшие значения** (могут возвращаться в ответе API; не используйте для выдачи прав):
        - `post_edit_delete_message` — устарело, используйте `write`
        - `edit_message` — устарело, используйте `edit`
        - `delete_message` — устарело, используйте `delete`

    UpdateType:
      type: string
      enum:
        - bot_added
        - bot_started
        - bot_stopped
        - bot_removed
        - chat_title_changed
        - dialog_cleared
        - dialog_muted
        - dialog_unmuted
        - dialog_removed
        - message_callback
        - message_created
        - message_edited
        - message_removed
        - user_added
        - user_removed
        - comment_created
        - comment_edited
        - comment_removed
        - bot_admin_permissions_changed
      description: |
        Тип обновления (события).

        События `comment_created`, `comment_edited`, `comment_removed` добавлены вместе с группой методов
        комментариев в августе 2026 (`https://dev.max.ru/docs-api/changelog-api`, раздел Comments). Бот
        получает их, только если он администратор канала с правом `read_all_messages`.

        Событие `bot_admin_permissions_changed` (изменение прав администратора бота) **не расписано на
        страницах текстовой документации** — оно добавлено по официальной машинной схеме
        `https://github.com/max-messenger/api-schema` -> `schema.yaml`, схема
        `BotAdminPermissionsChangedUpdate` (проверено 2026-09-27).

    AttachmentType:
      type: string
      enum:
        - image
        - video
        - audio
        - file
        - contact
        - sticker
        - inline_keyboard
        - location
        - share
      description: |
        Тип вложения в сообщении.

        - `image` — изображения (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC; до 50 МБ или 7680×7680 px)
        - `video` — видео (MP4, MOV, MKV, WEBM; до 250 МБ)
        - `audio` — аудио (MP3, WAV, M4A и др.; до 256 МБ или 60 мин)
        - `file` — файлы (TXT, DOC, PDF и др.; до 4 ГБ)
        - `contact` — контакт пользователя (возвращается по кнопке `request_contact`; поле `hash` для верификации через `HMAC-SHA256(access_token, vcf_info)`)
        - `sticker` — стикеры
        - `inline_keyboard` — кнопки клавиатуры (до 210 кнопок в 30 рядах, до 7 в каждом; до 3 для link/open_app/request_geo_location/request_contact)
        - `location` — геолокация
        - `share` — медиафайлы с превью

        `type=photo` deprecated — используйте `type=image`.

        **Правила комбинирования вложений:**
        - Видео и изображения можно комбинировать друг с другом и одной кнопкой — максимум 12 вложений
        - Файл можно отправить только в комбинации с вложением с кнопками (не с изображением/видео) — максимум 1 файл + 1 вложение с кнопками
        - Примеры допустимых комбинаций: 6 видео+5 изображений+1 кнопки; 12 видео; 12 изображений; 11 видео+1 кнопки; 1 файл+1 кнопки

        **Для изображений** в качестве альтернативы токену можно использовать `url` — прямую ссылку на изображение. Для других медиафайлов такой способ недоступен.

        Для загрузки медиафайлов (`image`, `video`, `audio`, `file`, `share`) предварительно используйте `POST /uploads` и передайте полученный `token`.

    ButtonType:
      type: string
      enum:
        - callback
        - link
        - request_contact
        - request_geo_location
        - open_app
        - message
        - clipboard
      description: |
        Тип кнопки inline-клавиатуры.

        - `callback` — отправляет событие `message_callback` через Webhook/Long Polling
        - `link` — открывает ссылку в новой вкладке (макс. 2048 символов в URL)
        - `request_contact` — запрашивает контакт и номер телефона пользователя; сообщение с контактом содержит поле `hash` для верификации через `HMAC-SHA256(access_token, vcf_info)`
        - `request_geo_location` — запрашивает местоположение пользователя
        - `open_app` — открывает мини-приложение
        - `message` — отправляет боту текстовое сообщение
        - `clipboard` — копирует текст из свойства `payload` в буфер обмена

    # ─── Base Objects ─────────────────────────────────────────
    User:
      type: object
      description: |
        Базовый объект пользователя/бота.

        Обязательны `user_id`, `first_name`, `is_bot` — официальная `schema.yaml`, схема `User`
        (проверено 2026-09-27). `last_activity_time` объявлен nullable и может не возвращаться, если пользователь
        скрыл онлайн-статус (страница `https://dev.max.ru/docs-api/objects/User`, проверено 2026-10-19).
      properties:
        user_id:
          type: integer
          format: int64
          description: ID пользователя/бота
        first_name:
          type: string
          description: Отображаемое имя
        last_name:
          type: [string, "null"]
          description: Фамилия (не возвращается для ботов)
        username:
          type: [string, "null"]
          description: Имя пользователя
        is_bot:
          type: boolean
          description: '`true`, если это бот'
        last_activity_time:
          type: [integer, "null"]
          format: int64
          description: Время последней активности (Unix timestamp в миллисекундах). `null` или отсутствие — если пользователь скрыл онлайн-статус
        name:
          type: [string, "null"]
          description: |
            Устаревшее поле, скоро будет удалено.

            Поле задокументировано на странице `https://dev.max.ru/docs-api/objects/User` (проверено 2026-09-27),
            но **отсутствует** в официальной `schema.yaml` (схема `User`) — расхождение доки зафиксировано
            в `AGENTS.md` § 5.
      required:
        - user_id
        - first_name
        - is_bot

    UserWithPhoto:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          description: Пользователь с аватаром и описанием
          properties:
            description:
              type: [string, "null"]
              description: Описание (макс. 16000 символов; null, если не задано)
            avatar_url:
              type: [string, "null"]
              description: URL миниатюры аватара
            full_avatar_url:
              type: [string, "null"]
              description: URL полноразмерного аватара

    BotInfo:
      allOf:
        - $ref: "#/components/schemas/UserWithPhoto"
        - type: object
          description: Информация о боте (включая команды). Возвращается только методом GET /me.
          properties:
            commands:
              type: [array, "null"]
              description: Команды бота (макс. 32)
              items:
                $ref: "#/components/schemas/BotCommand"

    BotCommand:
      type: object
      description: |
        Команда бота.

        В официальной `schema.yaml` (схема `BotCommand`, проверено 2026-09-27) обязательно только `name`
        (`1..64` символов), а `description` опционален (`1..128` символов, nullable) — раньше спека ошибочно
        требовала оба поля.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Имя команды (без `/`)'
        description:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: Описание команды (опционально)

    ChatMember:
      allOf:
        - $ref: "#/components/schemas/UserWithPhoto"
        - type: object
          description: Участник чата/канала с данными о членстве
          properties:
            last_access_time:
              type: integer
              format: int64
              description: Время последней активности в чате (может быть неточным для суперчатов)
            is_owner:
              type: boolean
              description: Является ли владельцем чата/канала
            is_admin:
              type: boolean
              description: Является ли администратором чата/канала
            join_time:
              type: integer
              format: int64
              description: Дата вступления (Unix timestamp, в миллисекундах)
            permissions:
              type: [array, "null"]
              description: Права администратора (только для администраторов)
              items:
                $ref: "#/components/schemas/ChatAdminPermission"
            alias:
              type: [string, "null"]
              description: Алиас роли, отображаемый в настройках чата
          required:
            - last_access_time
            - is_owner
            - is_admin
            - join_time

    ChatAdmin:
      type: object
      description: Данные для назначения администратора
      required:
        - user_id
        - permissions
      properties:
        user_id:
          type: integer
          format: int64
          description: ID пользователя/бота
        permissions:
          type: array
          description: Права администратора
          items:
            $ref: "#/components/schemas/ChatAdminPermission"
        alias:
          type: [string, "null"]
          description: Алиас роли

    Image:
      type: object
      description: |
        Изображение.

        Состав полей и обязательность подтверждены официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `Image` (проверено 2026-09-27).
      properties:
        url:
          type: string
          format: uri
          description: URL изображения
      required:
        - url

    Chat:
      type: object
      description: |
        Информация о групповом чате или канале.

        Обязательны `chat_id`, `type`, `status`, `last_event_time`, `participants_count`, `is_public` —
        официальная `schema.yaml`, схема `Chat` (проверено 2026-09-27). Остальные поля приходят в подмножестве
        (например, `title` и `icon` — null для диалогов).
      properties:
        chat_id:
          type: integer
          format: int64
          description: ID чата/канала
        type:
          $ref: "#/components/schemas/ChatType"
        status:
          $ref: "#/components/schemas/ChatStatus"
        title:
          type: [string, "null"]
          description: Название чата/канала (null для диалогов)
        icon:
          anyOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
          description: Иконка чата
        last_event_time:
          type: integer
          format: int64
          description: Время последнего события (Unix timestamp в мс)
        participants_count:
          type: integer
          format: int32
          description: Количество участников (всегда 2 для диалогов)
        owner_id:
          type: [integer, "null"]
          format: int64
          description: ID владельца
        participants:
          type: [object, "null"]
          description: Участники с временем активности (null при списке чатов)
        is_public:
          type: boolean
          description: Публичность (всегда false для диалогов)
        link:
          type: [string, "null"]
          description: Ссылка на чат
        description:
          type: [string, "null"]
          description: Описание чата/канала
        dialog_with_user:
          anyOf:
            - $ref: "#/components/schemas/UserWithPhoto"
            - type: "null"
          description: Собеседник в диалоге (только для типа dialog)
        messages_count:
          type: [integer, "null"]
          description: Количество сообщений
        pinned_message:
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
          description: Закреплённое сообщение (только при запросе конкретного чата)
      required:
        - chat_id
        - type
        - status
        - last_event_time
        - participants_count
        - is_public

    Recipient:
      type: object
      description: |
        Получатель сообщения (пользователь, чат или канал).

        Набор значений `chat_type` подтверждён официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `ChatType` (проверено 2026-09-27):
        `dialog`, `chat`, `channel`. Поле обязательно, `chat_id`/`user_id`/`post_id` — в зависимости от типа.
      properties:
        chat_id:
          type: [integer, "null"]
          format: int64
          description: ID чата или канала (если сообщение отправлено в чат/канал)
        chat_type:
          $ref: "#/components/schemas/ChatType"
        user_id:
          type: [integer, "null"]
          format: int64
          description: ID пользователя (если сообщение отправлено в диалог)
        post_id:
          type: [string, "null"]
          description: ID поста (идентификатор комментируемого сообщения в канале)
      required:
        - chat_type

    MessageBody:
      type: object
      description: |
        Содержимое сообщения (текст, разметка и вложения). Может быть null, если только пересланное сообщение.

        Состав полей подтверждён 2026-09-27: в официальной `schema.yaml` (`MessageBody`) только
        `mid`, `seq`, `text`, `markup`, `attachments`, а страница объекта `Message` описывает `body`
        как «Содержимое сообщения. Текст + вложения». Поля `caption` и `format` удалены: `format`
        документирован только как параметр **запроса** (`NewMessageBody`, `NewCommentBody`), а `caption`
        не встречается ни в одной из 133 официальных схем.
      properties:
        mid:
          type: string
          description: Уникальный идентификатор сообщения (`mid`)
        seq:
          type: integer
          format: int64
          description: Порядковый номер (sequence) сообщения в чате
        text:
          type: [string, "null"]
          description: Текст сообщения (макс. 4000 символов)
        markup:
          type: [array, "null"]
          description: |
            Разметка текста, разобранная API (в ответе). Синтаксис исходного форматирования —
            `markdown` или `html`, см. `TextFormat` и раздел
            `https://dev.max.ru/docs-api/use-cases/sending-messages/text-formatting`
          items:
            $ref: "#/components/schemas/MarkupElement"
        attachments:
          type: [array, "null"]
          description: Вложения сообщения
          items:
            $ref: "#/components/schemas/Attachment"
      required:
        - mid
        - seq

    LinkedMessage:
      type: object
      description: |
        Пересланное или ответное сообщение.

        Состав полей подтверждён официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `LinkedMessage` (проверено 2026-09-27):
        `sender` — **объект `User`**, а не числовой ID; идентификаторы сообщения и чата перенесены
        в `message` (`MessageBody`) и `chat_id`.
      properties:
        type:
          type: string
          enum:
            - forward
            - reply
          description: Тип связанного сообщения
        message:
          allOf:
            - $ref: "#/components/schemas/MessageBody"
          description: Содержимое связанного (пересланного или отвеченного) сообщения
        sender:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: |
            Отправитель связанного сообщения. Может быть `null`, если сообщение опубликовано
            от имени канала
        chat_id:
          type: integer
          format: int64
          description: ID чата, в котором сообщение было отправлено изначально
      required:
        - type
        - message

    MessageStat:
      type: object
      description: |
        Статистика сообщения (только для постов в каналах).

        `views` обязателен — официальная `schema.yaml`, схема `MessageStat` (проверено 2026-09-27).
      properties:
        views:
          type: integer
          description: Количество просмотров
      required:
        - views

    Message:
      type: object
      description: |
        Сообщение в чате.

        Обязательны `recipient`, `body`, `timestamp` — официальная `schema.yaml`, схема `Message`
        (проверено 2026-09-27). `sender` необязателен: объект отсутствует, если сообщение отправлено в канал
        от имени канала.
      properties:
        sender:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: Пользователь, отправивший сообщение
        recipient:
          $ref: "#/components/schemas/Recipient"
        timestamp:
          type: integer
          format: int64
          description: Время создания (Unix timestamp в мс)
        link:
          anyOf:
            - $ref: "#/components/schemas/LinkedMessage"
            - type: "null"
          description: Связанное сообщение (пересылка или ответ)
        body:
          anyOf:
            - $ref: "#/components/schemas/MessageBody"
            - type: "null"
          description: Содержимое сообщения (может быть null для пересылок)
        stat:
          anyOf:
            - $ref: "#/components/schemas/MessageStat"
            - type: "null"
          description: Статистика (только для постов в каналах)
        url:
          type: [string, "null"]
          description: Публичный URL поста в канале (не для диалогов/групп)
      required:
        - recipient
        - body
        - timestamp

    NewMessageBody:
      type: object
      description: |
        Тело нового сообщения для создания/редактирования.

        **Форматирование текста** (полная таблица — см. `TextFormat`):
        - `markdown` — `*emphasized*`/`_emphasized_`, `**strong**`/`__strong__`, `~~strikethrough~~`, `++underline++`, `` `code` ``, `[text](url)`, `[Имя Фамилия](max://user/user_id)`, `^^выделенный^^`, `# заголовок`, `> цитата`
        - `html` — `<i>`/`<em>`, `<b>`/`<strong>`, `<del>`/`<s>`, `<ins>`/`<u>`, `<pre>`/`<code>`, `<a href="url">text</a>`, `<a href="max://user/user_id">Имя Фамилия</a>`, `<mark>text</mark>`, `<h1>`..`<h4>`, `<blockquote>`

        **Правила комбинирования вложений:**
        - Видео и изображения можно комбинировать друг с другом и одной кнопкой — максимум 12 вложений
        - Файл можно отправить только в комбинации с вложением с кнопками — максимум 1 файл + 1 вложение с кнопками
        - Примеры допустимых комбинаций: 6 видео+5 изображений+1 кнопки; 12 видео; 12 изображений; 11 видео+1 кнопки; 1 файл+1 кнопки

        **Загрузка медиафайлов:**
        - `POST /uploads` — для `image`, `video`, `audio`, `file`, `share` (возвращает токен)
        - `type=photo` deprecated — используйте `type=image`
        - Для `image` также допустим прямой URL в поле `payload.url`
      properties:
        text:
          type: [string, "null"]
          description: Текст сообщения (макс. 4000 символов)
          maxLength: 4000
        attachments:
          type: [array, "null"]
          description: |
            Вложения. `null` = без изменений; пустой массив = удалить все вложения
          items:
            $ref: "#/components/schemas/AttachmentRequest"
        link:
          anyOf:
            - $ref: "#/components/schemas/NewMessageLink"
            - type: "null"
          description: Ссылка на другое сообщение
        notify:
          type: boolean
          default: true
          description: Уведомлять ли участников
        format:
          anyOf:
            - $ref: "#/components/schemas/TextFormat"
            - type: "null"
          description: Если задан, текст будет отформатирован согласно указанной разметке

    NewMessageLink:
      type: object
      description: |
        Ссылка на сообщение в чате или пост в канале (для ответа или пересылки).

        Состав полей подтверждён официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `NewMessageLink` (проверено 2026-09-27):
        обязательны `type` и `mid`; поля `chat` в исходящей форме **нет** — идентификатор чата
        определяется получателем. В ответе API объект приходит в расширенной форме `LinkedMessage`
        (с `sender`, `chat_id` и `message`).
      properties:
        type:
          type: string
          enum:
            - forward
            - reply
          description: Тип ссылки
        mid:
          type: string
          minLength: 1
          description: Идентификатор (`mid`) исходного сообщения
      required:
        - type
        - mid

    # ─── Комментарии (добавлены в августе 2026) ───────────────
    # Источник: https://dev.max.ru/docs-api/changelog-api (раздел Comments) + схемы
    # https://github.com/max-messenger/api-schema → schema.yaml. Проверено 2026-09-27.
    CommentMessageBody:
      type: object
      description: |
        Содержимое комментария. В отличие от `MessageBody`, вложения **не допускаются**.
      properties:
        mid:
          type: string
          description: Уникальный идентификатор комментария (`mid`)
        seq:
          type: integer
          format: int64
          description: Порядковый номер (sequence) комментария в чате
        text:
          type: [string, "null"]
          description: Текст комментария
        markup:
          type: [array, "null"]
          description: Разобранная разметка текста (см. `MarkupElement`)
          items:
            $ref: "#/components/schemas/MarkupElement"
      required:
        - mid
        - seq

    CommentLinkedMessage:
      type: object
      description: |
        Пересланный или отвеченный комментарий. В отличие от `LinkedMessage`, поле `message` — это
        `CommentMessageBody`: у комментариев не бывает вложений.
      properties:
        type:
          type: string
          enum:
            - forward
            - reply
          description: Тип связанного сообщения
        message:
          allOf:
            - $ref: "#/components/schemas/CommentMessageBody"
          description: Содержимое связанного комментария
        sender:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: |
            Отправитель связанного комментария. Может быть `null`, если опубликовано от имени канала
        chat_id:
          type: integer
          format: int64
          description: ID чата, в котором комментарий был отправлен изначально
      required:
        - type
        - message

    CommentMessage:
      type: object
      description: |
        Комментарий в канале. В отличие от `Message`, у комментария **нет** публичного `url`,
        а в теле (`body`) **нет** вложений.
      properties:
        sender:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: |
            Автор комментария. Может быть `null`, если опубликовано от имени канала
        recipient:
          $ref: "#/components/schemas/Recipient"
        timestamp:
          type: integer
          format: int64
          description: Время создания (Unix timestamp в мс)
        link:
          anyOf:
            - $ref: "#/components/schemas/CommentLinkedMessage"
            - type: "null"
          description: Пересланный или отвеченный комментарий
        body:
          allOf:
            - $ref: "#/components/schemas/CommentMessageBody"
          description: Содержимое комментария (только текст, без вложений)
        stat:
          anyOf:
            - $ref: "#/components/schemas/MessageStat"
            - type: "null"
          description: Статистика комментария
      required:
        - body
        - recipient
        - timestamp

    NewCommentBody:
      type: object
      description: |
        Тело нового комментария. В отличие от `NewMessageBody`, вложения **не допускаются**.

        Поддерживается форматирование текста — `markdown` или `html` (см. `TextFormat`).
      properties:
        text:
          type: [string, "null"]
          maxLength: 4000
          description: Текст комментария
        format:
          anyOf:
            - $ref: "#/components/schemas/TextFormat"
            - type: "null"
          description: Если задан, текст будет отформатирован согласно указанной разметке
        link:
          anyOf:
            - $ref: "#/components/schemas/NewMessageLink"
            - type: "null"
          description: Ссылка на сообщение или комментарий (для ответа или пересылки)

    CommentMessageList:
      type: object
      description: Страница списка комментариев
      properties:
        messages:
          type: array
          description: Список комментариев
          items:
            $ref: "#/components/schemas/CommentMessage"
      required:
        - messages

    SendCommentResult:
      type: object
      description: Результат отправки комментария
      properties:
        message:
          $ref: "#/components/schemas/CommentMessage"
      required:
        - message

    AttachmentBase:
      type: object
      description: |
        Базовый объект вложения: только поле `type`.

        Наследуется всеми 9 подтипами ответа (`PhotoAttachment`, `VideoAttachment` и т.д.).
        В ответах API и в схемах сообщений используется не сам `AttachmentBase`, а `Attachment`.
      properties:
        type:
          $ref: "#/components/schemas/AttachmentType"
      required:
        - type

    Attachment:
      type: object
      description: |
        Вложение в сообщении (используется в `MessageBody.attachments` при чтении).

        Объединение 9 специализированных подтипов: базовое поле `type` берётся из `AttachmentBase`,
        `payload` и остальные поля — из подтипа. Каждый подтип закрепляет своё значение `type`
        через `enum`, поэтому `oneOf` однозначно выбирает ветку.

        **Отличие от официальной схемы:** в официальной `schema.yaml` часть метаданных лежит на
        верхнем уровне подтипа, а не в `payload`: `width`/`height`/`thumbnail`/`duration` у видео,
        `filename`/`size` у файла, `width`/`height` у стикера, `title`/`description`/`image_url`
        у превью ссылки, `transcription` у аудио. У нас все эти поля собраны внутри `payload`
        соответствующего подтипа — набор полей и обязательность совпадают с официальными,
        отличается только место. Решение зафиксировано в `AGENTS.md` § 2.1.

        Неподтверждённых полей, которых нет в официальной схеме, в вложениях не осталось
        (проверено 2026-09-27 по текстовым страницам доков).
      properties:
        type:
          $ref: "#/components/schemas/AttachmentType"
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          image: "#/components/schemas/PhotoAttachment"
          video: "#/components/schemas/VideoAttachment"
          audio: "#/components/schemas/AudioAttachment"
          file: "#/components/schemas/FileAttachment"
          sticker: "#/components/schemas/StickerAttachment"
          contact: "#/components/schemas/ContactAttachment"
          inline_keyboard: "#/components/schemas/InlineKeyboardAttachment"
          share: "#/components/schemas/ShareAttachment"
          location: "#/components/schemas/LocationAttachment"
      oneOf:
        - $ref: "#/components/schemas/PhotoAttachment"
        - $ref: "#/components/schemas/VideoAttachment"
        - $ref: "#/components/schemas/AudioAttachment"
        - $ref: "#/components/schemas/FileAttachment"
        - $ref: "#/components/schemas/StickerAttachment"
        - $ref: "#/components/schemas/ContactAttachment"
        - $ref: "#/components/schemas/InlineKeyboardAttachment"
        - $ref: "#/components/schemas/ShareAttachment"
        - $ref: "#/components/schemas/LocationAttachment"

    PhotoAttachment:
      type: object
      description: Вложение типа `image` — Изображение (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC; до 50 МБ или 7680×7680 px).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [image]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/PhotoAttachmentPayload"
          required:
            - payload

    VideoAttachment:
      type: object
      description: Вложение типа `video` — Видео (MP4, MOV, MKV, WEBM; до 250 МБ).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [video]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/VideoAttachmentPayload"
          required:
            - payload

    AudioAttachment:
      type: object
      description: Вложение типа `audio` — Аудио (MP3, WAV, M4A и др.; до 256 МБ или 60 мин) (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [audio]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/AudioAttachmentPayload"
          required:
            - payload

    FileAttachment:
      type: object
      description: Вложение типа `file` — Файл (TXT, DOC, PDF и др.; до 4 ГБ) (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [file]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/FileAttachmentPayload"
          required:
            - payload

    StickerAttachment:
      type: object
      description: Вложение типа `sticker` — Стикер (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [sticker]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/StickerAttachmentPayload"
          required:
            - payload

    ContactAttachment:
      type: object
      description: Вложение типа `contact` — Контакт пользователя (возвращается по кнопке `request_contact`) (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [contact]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/ContactAttachmentPayload"
          required:
            - payload

    InlineKeyboardAttachment:
      type: object
      description: Вложение типа `inline_keyboard` — Inline-клавиатура (до 210 кнопок в 30 рядах, до 7 в ряду).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [inline_keyboard]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/InlineKeyboardAttachmentPayload"
          required:
            - payload

    ShareAttachment:
      type: object
      description: 'Вложение типа `share` — Превью внешней ссылки (прикрепляется с `disable_link_preview: false`).'
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [share]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/ShareAttachmentPayload"
          required:
            - payload

    LocationAttachment:
      type: object
      description: |
        Вложение типа `location` — геолокация.

        В отличие от остальных вложений, `payload` здесь нет: координаты лежат на верхнем уровне
        (так в официальной машинной схеме, `https://github.com/max-messenger/api-schema` -> `schema.yaml`,
        схемы `LocationAttachment` / `LocationAttachmentRequest`, проверено 2026-09-27).
      allOf:
        - $ref: "#/components/schemas/AttachmentBase"
        - type: object
          properties:
            type:
              type: string
              enum: [location]
              description: Тип вложения, однозначно задаёт подтип
            latitude:
              type: number
              format: double
              description: Широта
            longitude:
              type: number
              format: double
              description: Долгота
          required:
            - latitude
            - longitude

    VideoAttachmentPayload:
      type: object
      description: |
        Payload видео.

        Обязательны `url` и `token` — официальная `schema.yaml`, схема `MediaAttachmentPayload`
        (наследует `AttachmentPayload` + `token`, проверено 2026-09-27).

        **Отличие от официальной схемы:** официально `width`, `height`, `thumbnail` и `duration`
        лежат на верхнем уровне подтипа `VideoAttachment`, а `url` — строка. У нас `width`, `height`,
        `thumbnail` и `duration` собраны в `payload`, а `url` — объект `VideoUrls` с готовыми
        ссылками. Решение зафиксировано в `AGENTS.md` § 2.1.
      properties:
        url:
          $ref: "#/components/schemas/VideoUrls"
        token:
          type: string
          description: Токен медиафайла
        width:
          type: [integer, "null"]
          description: Ширина видео
        height:
          type: [integer, "null"]
          description: Высота видео
        duration:
          type: [integer, "null"]
          description: Длительность в секундах
        thumbnail:
          anyOf:
            - $ref: "#/components/schemas/VideoThumbnail"
            - type: "null"
          description: Миниатюра видео
      required:
        - url
        - token

    AudioAttachmentPayload:
      type: object
      description: |
        Payload аудио.

        Обязательны `url` и `token` — официальная `schema.yaml`, схема `MediaAttachmentPayload`
        (наследует `AttachmentPayload` + `token`, проверено 2026-09-27).
      properties:
        url:
          type: string
          description: URL аудио
        token:
          type: string
          description: Токен медиафайла
        duration:
          type: [integer, "null"]
          description: Длительность в секундах
        transcription:
          type: [string, "null"]
          description: |
            Текстовая расшифровка аудио.

            **Отличие от официальной схемы:** официально поле лежит на верхнем уровне подтипа
            `AudioAttachment`, у нас — в `payload` (`AGENTS.md` § 2.1).
      required:
        - url
        - token

    FileAttachmentPayload:
      type: object
      description: |
        Payload файлового вложения.

        Обязательны `url`, `token`, `filename` и `size` — официальная `schema.yaml`, схема
        `FileAttachmentPayload` (наследует `AttachmentPayload` + `token`) и подтип `FileAttachment`
        (`filename` и `size`), проверено 2026-09-27.

        **Отличие от официальной схемы:** официально `filename` и `size` лежат на верхнем уровне
        подтипа `FileAttachment`, у нас — в `payload` (`AGENTS.md` § 2.1).
      properties:
        url:
          type: string
          format: uri
          description: URL файла
        token:
          type: string
          description: |
            Токен файла. Используйте `token`, если хотите переиспользовать один и тот же файл в других сообщениях.
        filename:
          type: string
          description: Имя загруженного файла
        size:
          type: integer
          format: int64
          description: Размер файла в байтах
      required:
        - url
        - token
        - filename
        - size

    ContactAttachmentPayload:
      type: object
      description: |
        Payload контакта (отправляемого через `request_contact`).

        Состав полей подтверждён официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `ContactAttachmentPayload`
        (проверено 2026-09-27): `vcf_info`, `hash`, `max_info` (`User`), все nullable.

        **Расхождение доки:** на странице «Отправка сообщений со стикерами и контактами»
        (`https://dev.max.ru/docs-api/use-cases/sending-messages/another-attachments`, проверено 2026-09-27)
        пример отправки контакта показывает поля `name` и `contact_id`, которых нет в официальной схеме.
        Спека следует машинной схеме — см. `AGENTS.md` § 5.
      properties:
        vcf_info:
          type: [string, "null"]
          description: Информация контакта в формате vCard. Перед хешированием необходимо преобразовать `\r\n` в реальные переносы строк
        max_info:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: Информация о пользователе в МАКС
        hash:
          type: [string, "null"]
          description: |
            Хеш для проверки подлинности контакта.
            Вычисляется как: `HMAC-SHA256(access_token, vcf_info)`
            где `access_token` — токен бота, а `vcf_info` — информация о контакте в формате vCard с заменёнными `\r\n` на реальные переносы строк.
            Если значения совпадают — пользователь поделился номером, привязанным к его аккаунту в МАКС.

    InlineKeyboardAttachmentPayload:
      type: object
      description: |
        Inline-клавиатура.

        `buttons` обязателен — официальная `schema.yaml`, схема
        `InlineKeyboardAttachmentRequestPayload` (`required: [buttons]`, `minItems: 1`,
        проверено 2026-09-27).
      properties:
        buttons:
          type: array
          minItems: 1
          description: Ряды кнопок (каждый элемент — массив кнопок; например `[[btn1, btn2], [btn3]]`)
          items:
            $ref: "#/components/schemas/InlineKeyboardButtonRow"
      required:
        - buttons

    InlineKeyboardButtonRow:
      type: array
      description: Ряд кнопок inline-клавиатуры (макс. 7)
      items:
        $ref: "#/components/schemas/InlineKeyboardButton"

    InlineKeyboardButton:
      type: object
      description: |
        Кнопка inline-клавиатуры.

        **Ограничения:**
        - Максимум 210 кнопок в 30 рядах
        - Максимум 7 кнопок в ряде (кроме типов link, open_app, request_geo_location, request_contact — макс. 3 в ряде)
        - Допускаются комбинации с `type=sticker`
      properties:
        type:
          $ref: "#/components/schemas/ButtonType"
        text:
          type: string
          description: Текст кнопки (2048 символов макс., поддерживает форматирование)
        payload:
          type: [string, "null"]
          description: |
            Пользовательские данные, возвращаемые в `callback`.
            Для `clipboard` — текст для копирования.
            Максимум 8 КБ.

            Если поле отсутствует, `callback` возвращается как `null`.
        url:
          type: [string, "null"]
          description: Ссылка (для типа `link`; макс. 2048 символов)
        intent:
          type: [string, "null"]
          description: |
            Интент для `request_geo_location`:
            - `sendOnce` — однократная отправка
            - `sendLive` — отправка текущего местоположения в реальном времени
        web_app:
          type: [string, "null"]
          description: |
            Публичное имя (username) бота или ссылка на него, чьё мини-приложение нужно открыть
            (для типа `open_app`). URL мини-приложения задаётся на платформе MAX, а не в кнопке.
        contact_id:
          type: [integer, "null"]
          description: Идентификатор бота, чьё мини-приложение нужно открыть (альтернатива `web_app` для типа `open_app`)
      required: [ type, text ]

    AttachmentRequestBase:
      type: object
      description: |
        Базовый объект запроса на вложение: только поле `type`.

        Наследуется всеми 9 подтипами запроса (`PhotoAttachmentRequest`, `VideoAttachmentRequest` и т.д.).
        В схемах запросов используется не сам `AttachmentRequestBase`, а `AttachmentRequest`.
      properties:
        type:
          $ref: "#/components/schemas/AttachmentType"
      required:
        - type

    AttachmentRequest:
      type: object
      description: |
        Вложение в запросе (используется в `NewMessageBody.attachments` при отправке сообщений).

        Объединение 9 специализированных подтипов, зеркало `Attachment` на стороне запроса:
        базовое поле `type` берётся из `AttachmentRequestBase`, `payload` — из подтипа.
        Каждый подтип закрепляет своё значение `type` через `enum`, поэтому `oneOf` выбирает
        ветку однозначно.
      properties:
        type:
          $ref: "#/components/schemas/AttachmentType"
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          image: "#/components/schemas/PhotoAttachmentRequest"
          video: "#/components/schemas/VideoAttachmentRequest"
          audio: "#/components/schemas/AudioAttachmentRequest"
          file: "#/components/schemas/FileAttachmentRequest"
          sticker: "#/components/schemas/StickerAttachmentRequest"
          contact: "#/components/schemas/ContactAttachmentRequest"
          inline_keyboard: "#/components/schemas/InlineKeyboardAttachmentRequest"
          share: "#/components/schemas/ShareAttachmentRequest"
          location: "#/components/schemas/LocationAttachmentRequest"
      oneOf:
        - $ref: "#/components/schemas/PhotoAttachmentRequest"
        - $ref: "#/components/schemas/VideoAttachmentRequest"
        - $ref: "#/components/schemas/AudioAttachmentRequest"
        - $ref: "#/components/schemas/FileAttachmentRequest"
        - $ref: "#/components/schemas/StickerAttachmentRequest"
        - $ref: "#/components/schemas/ContactAttachmentRequest"
        - $ref: "#/components/schemas/InlineKeyboardAttachmentRequest"
        - $ref: "#/components/schemas/ShareAttachmentRequest"
        - $ref: "#/components/schemas/LocationAttachmentRequest"

    PhotoAttachmentRequest:
      type: object
      description: Вложение типа `image` — изображения.
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [image]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/PhotoAttachmentRequestPayload"
          required:
            - payload

    VideoAttachmentRequest:
      type: object
      description: Вложение типа `video` — видео.
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [video]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/UploadedInfo"
          required:
            - payload

    AudioAttachmentRequest:
      type: object
      description: Вложение типа `audio` — аудио (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [audio]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/UploadedInfo"
          required:
            - payload

    FileAttachmentRequest:
      type: object
      description: Вложение типа `file` — файла (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [file]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/UploadedInfo"
          required:
            - payload

    StickerAttachmentRequest:
      type: object
      description: Вложение типа `sticker` — стикера (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [sticker]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/StickerAttachmentRequestPayload"
          required:
            - payload

    ContactAttachmentRequest:
      type: object
      description: Вложение типа `contact` — контакта (должно быть единственным вложением в сообщении).
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [contact]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/ContactAttachmentRequestPayload"
          required:
            - payload

    InlineKeyboardAttachmentRequest:
      type: object
      description: Вложение типа `inline_keyboard` — inline-клавиатуры.
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [inline_keyboard]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/InlineKeyboardAttachmentPayload"
          required:
            - payload

    ShareAttachmentRequest:
      type: object
      description: Вложение типа `share` — превью внешней ссылки.
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [share]
              description: Тип вложения, однозначно задаёт подтип
            payload:
              $ref: "#/components/schemas/ShareAttachmentPayload"
          required:
            - payload

    LocationAttachmentRequest:
      type: object
      description: |
        Вложение типа `location` — геолокация.

        В отличие от остальных вложений, `payload` здесь нет: координаты лежат на верхнем уровне
        (так в официальной машинной схеме, `https://github.com/max-messenger/api-schema` -> `schema.yaml`,
        схемы `LocationAttachment` / `LocationAttachmentRequest`, проверено 2026-09-27).
      allOf:
        - $ref: "#/components/schemas/AttachmentRequestBase"
        - type: object
          properties:
            type:
              type: string
              enum: [location]
              description: Тип вложения, однозначно задаёт подтип
            latitude:
              type: number
              format: double
              description: Широта
            longitude:
              type: number
              format: double
              description: Долгота
          required:
            - latitude
            - longitude

    ShareAttachmentPayload:
      type: object
      description: |
        Payload превью внешней ссылки — общее для запроса и ответа.

        `title`, `description` и `image_url` заполняются сервером при формировании превью и
        приходят только в ответе; официальная `schema.yaml` объявляет их на верхнем уровне подтипа
        `ShareAttachment` (все три nullable, `required` только `payload`), у нас — в `payload`
        (`AGENTS.md` § 2.1, проверено 2026-09-27).
      properties:
        url:
          type: [string, "null"]
          minLength: 1
          description: URL внешней ссылки, прикрепляемой как превью
        token:
          type: [string, "null"]
          description: Токен уже загруженного медиафайла
        title:
          type: [string, "null"]
          description: Заголовок превью ссылки
        description:
          type: [string, "null"]
          description: Описание превью ссылки
        image_url:
          type: [string, "null"]
          description: Изображение превью ссылки

    StickerAttachmentPayload:
      type: object
      description: |
        Payload вложения-стикера (ответная сторона).

        Обязательны `url`, `code`, `width` и `height` — официальная `schema.yaml`:
        `StickerAttachmentPayload` наследует `AttachmentPayload` (`url`) и добавляет `code`,
        а подтип `StickerAttachment` требует `width` и `height` (проверено 2026-09-27).

        **Отличие от официальной схемы:** официально `width` и `height` лежат на верхнем уровне
        подтипа `StickerAttachment`, у нас — в `payload` (`AGENTS.md` § 2.1). При отправке стикера
        код передаётся в `StickerAttachmentRequestPayload.code`.
      properties:
        url:
          type: string
          format: uri
          description: URL стикера
        code:
          type: string
          description: Идентификатор стикера
        width:
          type: integer
          description: Ширина стикера
        height:
          type: integer
          description: Высота стикера
      required:
        - url
        - code
        - width
        - height

    UploadEndpoint:
      type: object
      description: |
        Ответ `POST /uploads` — адрес для загрузки файла.

        Соответствует `UploadEndpoint` официальной схемы: `url` обязателен, `token` возвращается для `video`/`audio`.
      properties:
        url:
          type: string
          format: uri
          description: URL для загрузки файла
        token:
          type: [string, "null"]
          description: Токен загруженного медиа (для `video`/`audio`)
      required:
        - url

    UploadedInfo:
      type: object
      description: |
        Данные загруженного файла — используются как `payload` вложений `video`, `audio`, `file`.

        В официальной схеме `UploadedInfo` содержит только `token`; у нас добавлено поле `url`
        (сознательное отклонение, `AGENTS.md` § 2.1). Ответ `POST /uploads` описан отдельной
        схемой `UploadEndpoint`.
      properties:
        url:
          type: string
          format: uri
          description: URL файла для загрузки (без срока действия)
        token:
          type: string
          description: Токен файла (уникальный идентификатор загруженного медиа)

    PhotoAttachmentRequestPayload:
      type: object
      description: |
        Payload для прикрепления изображений к сообщению (тип `image`).

        Можно передать `token` уже загруженного файла, внешний `url`, либо `photos` — map
        загруженных изображений одним вложением (в официальной схеме `photos` — объект
        с дополнительными свойствами-токенами `PhotoToken`).
      properties:
        token:
          type: [string, "null"]
          description: Токен загруженного изображения (из `POST /uploads`)
        url:
          type: [string, "null"]
          minLength: 1
          description: URL внешнего изображения
        photos:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: Несколько загруженных изображений одним вложением (ключ — произвольный, значение — токен)

    StickerAttachmentRequestPayload:
      type: object
      description: Payload для прикрепления стикера к сообщению.
      properties:
        code:
          type: string
          description: Код стикера
      required:
        - code

    ContactAttachmentRequestPayload:
      type: object
      description: |
        Payload для прикрепления контакта к сообщению.

        В отличие от `ContactAttachmentPayload` (ответная сторона) здесь есть `name` и
        `contact_id` — они есть в официальной схеме именно у *запроса* контакта.
      properties:
        name:
          type: [string, "null"]
          description: Имя контакта
        contact_id:
          type: [integer, "null"]
          format: int64
          description: Идентификатор контакта, если он зарегистрирован в MAX
        vcf_info:
          type: [string, "null"]
          description: Полная информация о контакте в формате VCF
        vcf_phone:
          type: [string, "null"]
          description: Телефон контакта в формате VCF

    VideoThumbnail:
      type: object
      description: |
        Миниатюра видео.

        Состав полей подтверждён официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `VideoThumbnail`
        (проверено 2026-09-27): единственное поле `url`, обязательное.
      properties:
        url:
          type: string
          description: URL изображения миниатюры
      required:
        - url

    VideoUrls:
      type: object
      description: |
        URL-ы для скачивания и потокового воспроизведения видео по разрешениям.

        Состав полей подтверждён официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `VideoUrls` (проверено 2026-09-27).
        Отдельной страницы объекта в доках нет; на странице метода
        `https://dev.max.ru/docs-api/methods/GET/videos/-videoToken-` (проверено 2026-09-27) указан только
        сам объект `VideoUrls` без раскрытия полей.

        Все поля nullable — приходят только те разрешения, которые реально доступны.
      properties:
        mp4_1080:
          type: [string, "null"]
          description: URL видео в 1080p, если доступно
        mp4_720:
          type: [string, "null"]
          description: URL видео в 720p, если доступно
        mp4_480:
          type: [string, "null"]
          description: URL видео в 480p, если доступно
        mp4_360:
          type: [string, "null"]
          description: URL видео в 360p, если доступно
        mp4_240:
          type: [string, "null"]
          description: URL видео в 240p, если доступно
        mp4_144:
          type: [string, "null"]
          description: URL видео в 144p, если доступно
        hls:
          type: [string, "null"]
          description: URL потоковой трансляции (HLS), если доступно

    VideoInfo:
      type: object
      description: |
        Информация о видео-вложении (ответ `GET /videos/{videoToken}`).

        Соответствует официальной схеме `VideoAttachmentDetails` (проверено 2026-09-27); локальное имя `VideoInfo`
        оставлено для обратной совместимости. Обязательны `token`, `width`, `height`, `duration`;
        `urls` и `thumbnail` nullable.
      properties:
        token:
          type: string
          description: Токен видео-вложения
        urls:
          anyOf:
            - $ref: "#/components/schemas/VideoUrls"
            - type: "null"
          description: URL для скачивания/воспроизведения (null, если недоступны)
        thumbnail:
          anyOf:
            - $ref: "#/components/schemas/PhotoAttachmentPayload"
            - type: "null"
          description: Миниатюра видео
        width:
          type: integer
          description: Ширина видео
        height:
          type: integer
          description: Высота видео
        duration:
          type: integer
          description: Длительность в секундах
      required:
        - token
        - width
        - height
        - duration

    PhotoAttachmentPayload:
      type: object
      description: |
        Payload фото-вложения: метаданные изображения.

        Обязательны `photo_id`, `token`, `url` — официальная `schema.yaml`, схема `PhotoAttachmentPayload`
        (проверено 2026-09-27). Используется также как миниатюра видео в `VideoInfo.thumbnail`
        (официальный `VideoAttachmentDetails.thumbnail` ссылается именно на `PhotoAttachmentPayload`).

        Полей `width`/`height` здесь нет: официальная схема объявляет их для видео и стикера, но
        сознательно не для фото, и страницы доков их тоже не упоминают. Удалены 2026-09-27.
      properties:
        photo_id:
          type: integer
          format: int64
          description: Уникальный идентификатор изображения (из `POST /uploads`)
        token:
          type: string
          description: Токен изображения (из `POST /uploads`)
        url:
          type: string
          format: uri
          description: URL изображения
      required:
        - photo_id
        - token
        - url

    Subscription:
      type: object
      description: |
        Подписка на webhook.

        Поля `url` и `time` обязательны, `update_types` опционален — подтверждено официальной машинной
        спецификацией `https://github.com/max-messenger/api-schema` → `schema.yaml`, схема `Subscription`
        (проверено 2026-09-27).
      properties:
        url:
          type: string
          format: uri
          description: URL webhook
        time:
          type: integer
          format: int64
          description: Unix-время создания подписки (в миллисекундах)
        update_types:
          type: [array, "null"]
          uniqueItems: true
          description: Типы обновлений, на которые подписан бот
          items:
            type: string
            minLength: 1
            examples:
              - message_created
              - bot_started
      required:
        - url
        - time

    UpdateBase:
      type: object
      description: |
        Базовые поля любого события MAX.

        Наследуется всеми 19 подтипами `Update` (`MessageCreatedUpdate`, `BotAddedToChatUpdate` и т.д.).
        В ответах API и вебхуках используется не сам `UpdateBase`, а `Update` — объединение подтипов.
      properties:
        update_type:
          $ref: "#/components/schemas/UpdateType"
        timestamp:
          type: integer
          format: int64
          description: Время события (Unix timestamp в мс)
      required:
        - update_type
        - timestamp

    Update:
      type: object
      description: |
        Событие MAX (обновление). Приходит через вебхук (`POST /subscriptions`) или Long Polling
        (`GET /updates`).

        Это объединение 19 специализированных подтипов: два базовых поля (`update_type`, `timestamp`)
        берутся из `UpdateBase`, остальные зависят от типа события. Каждый подтип закрепляет своё
        значение в `update_type` через `enum`, поэтому `oneOf` однозначно выбирает ветку, а `discriminator`
        позволяет кодогенераторам строить наследование.

        | Тип события | Схема | Событие |
        |-------------|-------|---------|
        | `bot_added` | `BotAddedToChatUpdate` | Бот добавлен в чат/канал |
        | `bot_admin_permissions_changed` | `BotAdminPermissionsChangedUpdate` | Изменились права администратора бота в чате/канале |
        | `bot_removed` | `BotRemovedFromChatUpdate` | Бот удалён из чата/канала |
        | `bot_started` | `BotStartedUpdate` | Пользователь начал или возобновил разговор с ботом |
        | `bot_stopped` | `BotStoppedUpdate` | Пользователь остановил или удалил бота |
        | `chat_title_changed` | `ChatTitleChangedUpdate` | Название чата/канала изменено |
        | `comment_created` | `CommentCreatedUpdate` | Создан комментарий к посту в канале |
        | `comment_edited` | `CommentEditedUpdate` | Комментарий отредактирован |
        | `comment_removed` | `CommentRemovedUpdate` | Комментарий удалён |
        | `dialog_cleared` | `DialogClearedUpdate` | Пользователь очистил историю диалога |
        | `dialog_muted` | `DialogMutedUpdate` | Пользователь отключил уведомления диалога |
        | `dialog_removed` | `DialogRemovedUpdate` | Пользователь удалил диалог (также вызывается `bot_stopped`) |
        | `dialog_unmuted` | `DialogUnmutedUpdate` | Пользователь включил уведомления диалога |
        | `message_callback` | `MessageCallbackUpdate` | Пользователь нажал кнопку inline-клавиатуры |
        | `message_created` | `MessageCreatedUpdate` | Новое сообщение или пост в канале |
        | `message_edited` | `MessageEditedUpdate` | Сообщение отредактировано |
        | `message_removed` | `MessageRemovedUpdate` | Сообщение удалено |
        | `user_added` | `UserAddedToChatUpdate` | Новый пользователь вступил в чат/канал |
        | `user_removed` | `UserRemovedFromChatUpdate` | Пользователь удалён или покинул чат/канал |

        События комментариев (`comment_created`, `comment_edited`, `comment_removed`) бот получает,
        **только если он администратор канала** с правом `read_all_messages`.

        Структура подтипов и их поля подтверждены официальной машинной спецификацией
        `https://github.com/max-messenger/api-schema` -> `schema.yaml` (`*Update`, проверено 2026-09-27).

        Отличие от официальной схемы: там базовая часть называется `Update` и не содержит `oneOf`,
        из-за чего `required` подтипов не проверяется валидатором. Здесь база вынесена в `UpdateBase`,
        а `Update` — точка входа с `oneOf` из 19 подтипов; общие поля и их обязательность берутся из
        `UpdateBase` через `allOf`, чтобы не дублировать их в двух схемах.
      allOf:
        - $ref: "#/components/schemas/UpdateBase"
      discriminator:
        propertyName: update_type
        mapping:
          message_created: "#/components/schemas/MessageCreatedUpdate"
          message_edited: "#/components/schemas/MessageEditedUpdate"
          message_removed: "#/components/schemas/MessageRemovedUpdate"
          message_callback: "#/components/schemas/MessageCallbackUpdate"
          comment_created: "#/components/schemas/CommentCreatedUpdate"
          comment_edited: "#/components/schemas/CommentEditedUpdate"
          comment_removed: "#/components/schemas/CommentRemovedUpdate"
          bot_added: "#/components/schemas/BotAddedToChatUpdate"
          bot_admin_permissions_changed: "#/components/schemas/BotAdminPermissionsChangedUpdate"
          bot_removed: "#/components/schemas/BotRemovedFromChatUpdate"
          user_added: "#/components/schemas/UserAddedToChatUpdate"
          user_removed: "#/components/schemas/UserRemovedFromChatUpdate"
          bot_started: "#/components/schemas/BotStartedUpdate"
          bot_stopped: "#/components/schemas/BotStoppedUpdate"
          chat_title_changed: "#/components/schemas/ChatTitleChangedUpdate"
          dialog_cleared: "#/components/schemas/DialogClearedUpdate"
          dialog_muted: "#/components/schemas/DialogMutedUpdate"
          dialog_unmuted: "#/components/schemas/DialogUnmutedUpdate"
          dialog_removed: "#/components/schemas/DialogRemovedUpdate"
      oneOf:
        - $ref: "#/components/schemas/MessageCreatedUpdate"
        - $ref: "#/components/schemas/MessageEditedUpdate"
        - $ref: "#/components/schemas/MessageRemovedUpdate"
        - $ref: "#/components/schemas/MessageCallbackUpdate"
        - $ref: "#/components/schemas/CommentCreatedUpdate"
        - $ref: "#/components/schemas/CommentEditedUpdate"
        - $ref: "#/components/schemas/CommentRemovedUpdate"
        - $ref: "#/components/schemas/BotAddedToChatUpdate"
        - $ref: "#/components/schemas/BotAdminPermissionsChangedUpdate"
        - $ref: "#/components/schemas/BotRemovedFromChatUpdate"
        - $ref: "#/components/schemas/UserAddedToChatUpdate"
        - $ref: "#/components/schemas/UserRemovedFromChatUpdate"
        - $ref: "#/components/schemas/BotStartedUpdate"
        - $ref: "#/components/schemas/BotStoppedUpdate"
        - $ref: "#/components/schemas/ChatTitleChangedUpdate"
        - $ref: "#/components/schemas/DialogClearedUpdate"
        - $ref: "#/components/schemas/DialogMutedUpdate"
        - $ref: "#/components/schemas/DialogUnmutedUpdate"
        - $ref: "#/components/schemas/DialogRemovedUpdate"
    MessageCreatedUpdate:
      type: object
      description: Событие `message_created` — новое сообщение или пост в канале.
      allOf:
        - $ref: "#/components/schemas/UpdateBase"
        - type: object
          properties:
            update_type:
              type: string
              enum: [message_created]
              description: Тип события, однозначно задаёт подтип `Update`
            message:
              allOf:
                - $ref: "#/components/schemas/Message"
              description: Сообщение
            user_locale:
              type: [string, "null"]
              description: Текущий язык пользователя в формате IETF BCP 47 (например, `ru`)
          required:
            - message
      examples:
        - summary: message_created — новое сообщение или пост в канале
          value:
            update_type: message_created
            timestamp: 1755000010000
            message:
              sender:
                user_id: 1000000001
                first_name: Иван
                is_bot: false
              recipient:
                chat_id: 123456789
                chat_type: dialog
              timestamp: 1755000010000
              body:
                mid: mid_20260814_002
                seq: 0
                text: Привет!
            user_locale: ru


        dialog_with_user:
          allOf:
            - $ref: "#/components/schemas/UserWithPhoto"
          nullable: true
          description: Собеседник в диалоге (только для типа dialog)
        messages_count:
          type: integer
          nullable: true
          description: Количество сообщений
        pinned_message:
          allOf:
            - $ref: "#/components/schemas/Message"
          nullable: true
          description: Закреплённое сообщение (только при запросе конкретного чата)

    Recipient:
      type: object
      description: Получатель сообщения (пользователь или чат)
      properties:
        chat_id:
          type: integer
          format: int64
          nullable: true
          description: ID чата (если сообщение отправлено в чат)
        chat_type:
          type: string
          nullable: true
          description: Тип чата (например, "dialog"); набор значений уточнить по API
        user_id:
          type: integer
          format: int64
          nullable: true
          description: ID пользователя (если сообщение отправлено в диалог)

    MessageBody:
      type: object
      description: Содержимое сообщения (текст и вложения). Может быть null, если только пересланное сообщение.
      properties:
        mid:
          type: string
          description: ID сообщения
        seq:
          type: integer
          format: int64
          description: Порядковый номер
        text:
          type: string
          nullable: true
          description: Текст сообщения (макс. 4000 символов)
        attachments:
          type: array
          nullable: true
          description: Вложения сообщения
          items:
            $ref: "#/components/schemas/Attachment"
        caption:
          type: string
          nullable: true
          description: Подпись к вложению
        format:
          $ref: "#/components/schemas/TextFormat"

    LinkedMessage:
      type: object
      description: Пересланное или ответное сообщение
      properties:
        type:
          type: string
          enum:
            - forwarded
            - reply
          description: Тип связанного сообщения
        sender:
          type: integer
          format: int64
          description: ID отправителя
        mid:
          type: string
          description: ID связанного сообщения
        chat:
          type: string
          nullable: true
          description: ID чата, из которого переслано сообщение

    MessageStat:
      type: object
      description: Статистика сообщения (только для постов в каналах)
      properties:
        views:
          type: integer
          description: Количество просмотров

    Message:
      type: object
      description: Сообщение в чате
      properties:
        sender:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
          description: Пользователь, отправивший сообщение
        recipient:
          $ref: "#/components/schemas/Recipient"
        timestamp:
          type: integer
          format: int64
          description: Время создания (Unix timestamp в мс)
        link:
          allOf:
            - $ref: "#/components/schemas/LinkedMessage"
          nullable: true
          description: Связанное сообщение (пересылка или ответ)
        body:
          allOf:
            - $ref: "#/components/schemas/MessageBody"
          nullable: true
          description: Содержимое сообщения (может быть null для пересылок)
        stat:
          allOf:
            - $ref: "#/components/schemas/MessageStat"
          nullable: true
          description: Статистика (только для постов в каналах)
        url:
          type: string
          nullable: true
          description: Публичный URL поста в канале (не для диалогов/групп)

    NewMessageBody:
      type: object
      description: |
        Тело нового сообщения для создания/редактирования.

        **Форматирование текста:**
        - `markdown` — поддерживает: **жирный**, _курсив_, [ссылки](url), `моноширинный`, ~зачёркнутый~, ||спойлер||, [упоминания](https://max.ru/username)
        - `html` — поддерживает: `<b>жирный</b>`, `<i>курсив</i>`, `<a href="url">ссылки</a>`, `<code>моноширинный</code>`, `<s>зачёркнутый</s>`, `<mention user-id="12345">упоминания</mention>`, `<pre>preformatted</pre>`, `<pre><code class="language-python">код</code></pre>

        **Правила комбинирования вложений:**
        - Видео и изображения можно комбинировать друг с другом и одной кнопкой — максимум 12 вложений
        - Файл можно отправить только в комбинации с вложением с кнопками — максимум 1 файл + 1 вложение с кнопками
        - Примеры допустимых комбинаций: 6 видео+5 изображений+1 кнопки; 12 видео; 12 изображений; 11 видео+1 кнопки; 1 файл+1 кнопки

        **Загрузка медиафайлов:**
        - `POST /uploads` — для `image`, `video`, `audio`, `file`, `share` (возвращает токен)
        - `type=photo` deprecated — используйте `type=image`
        - `video_size` deprecated — используйте `duration` в ответе `POST /uploads`
        - Для `image` также допустим прямой URL в поле `payload.url`

        **Отправка видео/аудио:**
        - Загрузите файл через `POST /uploads`
        - В `POST /uploads` вызовите `send_push=true` для автоматической отправки всем подписчикам
      properties:
        text:
          type: string
          nullable: true
          description: Текст сообщения (макс. 4000 символов)
          maxLength: 4000
        attachments:
          type: array
          nullable: true
          description: |
            Вложения. `null` = без изменений; пустой массив = удалить все вложения
          items:
            $ref: "#/components/schemas/AttachmentRequest"
        link:
          allOf:
            - $ref: "#/components/schemas/NewMessageLink"
          nullable: true
          description: Ссылка на другое сообщение
        notify:
          type: boolean
          default: true
          description: Уведомлять ли участников
        format:
          $ref: "#/components/schemas/TextFormat"

    NewMessageLink:
      type: object
      description: Ссылка на другое сообщение
      properties:
        type:
          type: string
          enum:
            - reply
            - forward
          description: Тип ссылки
        mid:
          type: string
          description: ID связанного сообщения
        chat:
          type: string
          nullable: true
          description: ID чата (для пересылок из другого чата)

    Attachment:
      type: object
      description: Вложение в сообщении (используется в MessageBody при чтении)
      properties:
        type:
          $ref: "#/components/schemas/AttachmentType"
        payload:
          type: object
          nullable: true
          description: Payload вложения (зависит от типа)
          oneOf:
            - $ref: "#/components/schemas/ImageAttachmentPayload"
            - $ref: "#/components/schemas/VideoAttachmentPayload"
            - $ref: "#/components/schemas/AudioAttachmentPayload"
            - $ref: "#/components/schemas/FileAttachmentPayload"
            - $ref: "#/components/schemas/ContactAttachmentPayload"
            - $ref: "#/components/schemas/LocationAttachmentPayload"
            - $ref: "#/components/schemas/InlineKeyboardAttachmentPayload"
      required: [ type ]

    ImageAttachmentPayload:
      type: object
      description: Payload изображения (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC; до 50 МБ или 7680×7680 px — оба критерия должны выполняться)
      properties:
        url:
          type: string
          description: URL изображения
        token:
          type: string
          description: Токен медиафайла

    VideoAttachmentPayload:
      type: object
      description: Payload видео
      properties:
        url:
          $ref: "#/components/schemas/VideoUrls"
        token:
          type: string
          description: Токен медиафайла
        duration:
          type: integer
          nullable: true
          description: Длительность в секундах

    AudioAttachmentPayload:
      type: object
      description: Payload аудио
      properties:
        url:
          type: string
          description: URL аудио
        token:
          type: string
          description: Токен медиафайла
        duration:
          type: integer
          nullable: true
          description: Длительность в секундах

    FileAttachmentPayload:
      type: object
      description: Payload файла
      properties:
        url:
          type: string
          description: URL файла
        token:
          type: string
          description: Токен медиафайла
        file_size:
          type: integer
          description: Размер файла в байтах

    ContactAttachmentPayload:
      type: object
      description: Payload контакта (отправляемого через request_contact)
      properties:
        vcf_info:
          type: string
          nullable: true
          description: Информация контакта в формате vCard. Перед хешированием необходимо преобразовать `\r\n` в реальные переносы строк
        vcf_phone:
          type: string
          nullable: true
          description: Номер телефона контакта
        max_info:
          type: object
          nullable: true
          description: Дополнительная информация о пользователе
        hash:
          type: string
          description: |
            Хеш для проверки подлинности контакта.
            Вычисляется как: `HMAC-SHA256(access_token, vcf_info)`
            где `access_token` — токен бота, а `vcf_info` — информация о контакте в формате vCard с заменёнными `\r\n` на реальные переносы строк.
            Если значения совпадают — пользователь поделился номером, привязанным к его аккаунту в МАКС.

    LocationAttachmentPayload:
      type: object
      description: Payload геолокации (отправляемой через request_geo_location)
      properties:
        latitude:
          type: number
          format: double
          description: Широта
        longitude:
          type: number
          format: double
          description: Долгота

    InlineKeyboardAttachmentPayload:
      type: object
      description: Inline-клавиатура
      properties:
        buttons:
          type: array
          description: Ряды кнопок (каждый элемент — массив кнопок; например `[[btn1, btn2], [btn3]]`)
          items:
            $ref: "#/components/schemas/InlineKeyboardButtonRow"

    InlineKeyboardButtonRow:
      type: array
      description: Ряд кнопок inline-клавиатуры (макс. 7)
      items:
        $ref: "#/components/schemas/InlineKeyboardButton"

    InlineKeyboardButton:
      type: object
      description: |
        Кнопка inline-клавиатуры.

        **Ограничения:**
        - Максимум 210 кнопок в 30 рядах
        - Максимум 7 кнопок в ряде (кроме типов link, open_app, request_geo_location, request_contact — макс. 3 в ряде)
        - Допускаются комбинации с `type=sticker`
      properties:
        type:
          $ref: "#/components/schemas/ButtonType"
        text:
          type: string
          description: Текст кнопки (2048 символов макс., поддерживает форматирование)
        payload:
          type: string
          nullable: true
          description: |
            Пользовательские данные, возвращаемые в `callback`.
            Для `clipboard` — текст для копирования.
            Максимум 8 КБ.

            Если поле отсутствует, `callback` возвращается как `null`.
        url:
          type: string
          nullable: true
          description: Ссылка (для типа `link`; макс. 2048 символов)
        intent:
          type: string
          nullable: true
          description: |
            Интент для `request_geo_location`:
            - `sendOnce` — однократная отправка
            - `sendLive` — отправка текущего местоположения в реальном времени
        app_data:
          type: string
          nullable: true
          description: Данные для открытия мини-приложения (для типа `open_app`)
      required: [ type, text ]

    AttachmentRequest:
      type: object
      description: Запрос на вложение
      properties:
        type:
          $ref: "#/components/schemas/AttachmentType"
        payload:
          type: object
          nullable: true
          description: Payload вложения
          properties:
            token:
              type: string
              nullable: true
              description: Токен медиафайла (из ответа POST /uploads)
            url:
              type: string
              nullable: true
              description: URL медиафайла
            buttons:
              type: array
              nullable: true
              description: Ряды inline-клавиатуры
              items:
                $ref: "#/components/schemas/InlineKeyboardButtonRow"
      required: [ type ]

    VideoUrls:
      type: object
      description: URL для воспроизведения/скачивания видео
      properties:
        mp4:
          type: string
          nullable: true
          description: URL для скачивания в формате MP4
        preview:
          type: string
          nullable: true
          description: URL превью видео

    VideoInfo:
      type: object
      description: Информация о видео
      properties:
        token:
          type: string
          description: Токен видео-вложения
        urls:
          allOf:
            - $ref: "#/components/schemas/VideoUrls"
          nullable: true
          description: URL для скачивания/воспроизведения (null, если недоступны)
        thumbnail:
          allOf:
            - $ref: "#/components/schemas/PhotoAttachmentPayload"
          nullable: true
          description: Миниатюра видео
        width:
          type: integer
          description: Ширина видео
        height:
          type: integer
          description: Высота видео
        duration:
          type: integer
          description: Длительность в секундах

    PhotoAttachmentPayload:
      type: object
      description: Payload фото-вложения
      properties:
        url:
          type: string
          format: uri
          description: URL изображения
        width:
          type: integer
          description: Ширина
        height:
          type: integer
          description: Высота

    Subscription:
      type: object
      description: Подписка на webhook
      properties:
        url:
          type: string
          format: uri
          description: URL webhook
        update_types:
          type: array
          nullable: true
          description: Типы обновлений
          items:
            type: string

    FailedUserDetails:
      type: object
      description: Подробности ошибки при добавлении пользователя
      properties:
        user_id:
          type: integer
          format: int64
          description: ID пользователя
        error:
          type: string
          description: Описание ошибки

    Update:
      type: object
      description: |
        Объект обновления (события) в чатах/каналах.
        Возвращается через Webhook (POST /subscriptions) или Long Polling (GET /updates).

        **Типы событий:**

        | Тип | Описание |
        |-----|----------|
        | `bot_added` | Бот добавлен в чат/канал |
        | `bot_started` | Пользователь начал/возобновил разговор с ботом |
        | `bot_stopped` | Пользователь остановил/удалил бота (с `dialog_removed` при удалении) |
        | `bot_removed` | Бот удалён из чата/канала |
        | `chat_title_changed` | Название чата/канала изменено |
        | `dialog_cleared` | Пользователь очистил историю диалога |
        | `dialog_muted` | Пользователь отключил уведомления диалога |
        | `dialog_unmuted` | Пользователь включил уведомления диалога |
        | `dialog_removed` | Пользователь удалил диалог (также вызывает `bot_stopped`) |
        | `message_callback` | Пользователь нажал кнопку |
        | `message_created` | Новое сообщение или пост в канале |
        | `message_edited` | Сообщение отредактировано |
        | `message_removed` | Сообщение удалено |
        | `user_added` | Новый пользователь вступил в чат/канал |
        | `user_removed` | Пользователь удалён/покинул чат/канал |

        Набор полей зависит от `update_type`. Поля не обязательны — реальный API отдаёт
        только поля, относящиеся к конкретному типу события.

        **Поля по типам событий:**

        | Тип события | Поля |
        |-------------|------|
        | `bot_added` | `timestamp`, `chat_id`, `user`, `is_channel` |
        | `bot_started` | `timestamp`, `chat_id`, `user`, `payload`, `user_locale` |
        | `bot_stopped` | `timestamp`, `chat_id`, `user`, `user_locale` |
        | `bot_removed` | `timestamp`, `chat_id`, `user`, `is_channel` |
        | `chat_title_changed` | `timestamp`, `chat_id`, `user`, `title` |
        | `dialog_cleared` | `timestamp`, `chat_id`, `user`, `user_locale` |
        | `dialog_muted` | `timestamp`, `chat_id`, `user`, `muted_until`, `user_locale` |
        | `dialog_unmuted` | `timestamp`, `chat_id`, `user`, `user_locale` |
        | `dialog_removed` | `timestamp`, `chat_id`, `user`, `user_locale` |
        | `message_callback` | `timestamp`, `callback`, `user_locale` |
        | `message_created` | `timestamp`, `message`, `user_locale` |
        | `message_edited` | `timestamp`, `message` |
        | `message_removed` | `timestamp`, `message_id`, `chat_id`, `user_id` |
        | `user_added` | `timestamp`, `chat_id`, `user`, `inviter_id`, `is_channel` |
        | `user_removed` | `timestamp`, `chat_id`, `user`, `admin_id`, `is_channel` |
      properties:
        update_type:
          $ref: "#/components/schemas/UpdateType"
        timestamp:
          type: integer
          format: int64
          description: Время события (Unix timestamp в мс)
        user_locale:
          type: string
          nullable: true
          description: Текущий язык пользователя в формате IETF BCP 47 (например, "ru")
        chat_id:
          type: integer
          format: int64
          description: ID чата/диалога, в котором произошло событие. Для message_created, message_edited, message_callback отсутствует на верхнем уровне — источник message.recipient.chat_id (для message_callback — callback.message.recipient.chat_id).
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          description: Пользователь, связанный с событием. Присутствует для bot_*, dialog_*, user_*. Для message_created, message_edited отсутствует на верхнем уровне — источник message.sender (для message_callback — callback.message.sender).
        is_channel:
          type: boolean
          description: '`true`, если событие произошло в канале (а не в чате)'
          nullable: true
        title:
          type: string
          nullable: true
          description: Новое название чата (для события chat_title_changed)
        payload:
          type: string
          nullable: true
          description: Дополнительные данные из диплинков, переданные при запуске бота. До 512 символов (для события bot_started)
        muted_until:
          type: integer
          format: int64
          nullable: true
          description: Время, до которого диалог был отключён (Unix timestamp в мс, для события dialog_muted)
        message_id:
          type: string
          nullable: true
          description: ID удалённого сообщения (для события message_removed)
        user_id:
          type: integer
          format: int64
          nullable: true
          description: Пользователь, удаливший сообщение (для события message_removed)
        inviter_id:
          type: integer
          format: int64
          nullable: true
          description: Пользователь, добавивший нового пользователя в чат. Может быть null, если пользователь присоединился по ссылке (для события user_added)
        admin_id:
          type: integer
          format: int64
          nullable: true
          description: Администратор, удаливший пользователя из чата. Может быть null, если пользователь покинул чат сам (для события user_removed)
        message:
          allOf:
            - $ref: "#/components/schemas/Message"
          nullable: true
          description: Сообщение (для событий message_created, message_edited; для message_callback — внутри callback.message)
        callback:
          type: object
          nullable: true
          description: Данные callback-кнопки (для события message_callback)
          properties:
            callback_id:
              type: string
              description: ID callback-кнопки
            payload:
              type: string
              nullable: true
              description: Payload кнопки
            message:
              allOf:
                - $ref: "#/components/schemas/Message"
              nullable: true
              description: Изначальное сообщение с встроенной клавиатурой. Может быть null, если оно было удалено к моменту получения события

    SuccessResponse:
      type: object
      description: Стандартный ответ об успехе/ошибке
      properties:
        success:
          type: boolean
          description: '`true`, если операция выполнена успешно'
        message:
          type: string
          nullable: true
          description: Описание ошибки (при неуспехе)

    ErrorResponse:
      type: object
      description: Ответ об ошибке
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Описание ошибки
        error:
          type: string
          nullable: true
          description: Дополнительная информация об ошибке

          type: integer
          format: int64
          description: ID пользователя/бота
        permissions:
          type: array
          description: Права администратора
          items:
            $ref: "#/components/schemas/ChatAdminPermission"
        alias:
          type: string
          nullable: true
          description: Алиас роли

    Image:
      type: object
      description: Изображение
      properties:
        url:
          type: string
          format: uri
          description: URL изображения

    Chat:
      type: object
      description: Информация о групповом чате или канале
      properties:
        chat_id:
          type: integer
          format: int64
          description: ID чата/канала
        type:
          $ref: "#/components/schemas/ChatType"
        status:
          $ref: "#/components/schemas/ChatStatus"
        title:
          type: string
          nullable: true
          description: Название чата/канала (null для диалогов)
        icon:
          allOf:
